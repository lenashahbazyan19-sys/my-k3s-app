apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-k3s-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-k3s-app
  template:
    metadata:
      labels:
        app: my-k3s-app
    spec:
      containers:
      - name: my-k3s-app
        image: lenaash/my-k3s-app:latest

        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-k3s-app-service
spec:
  type: LoadBalancer
  selector:
    app: my-k3s-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
